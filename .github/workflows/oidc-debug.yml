name: oidc-debug
on: workflow_dispatch
permissions: { id-token: write, contents: read }
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - run: |
          tok=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref}' || true
