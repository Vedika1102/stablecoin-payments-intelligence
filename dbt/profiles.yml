# dev  : DuckDB over the local lake Parquet (laptop + CI). prod : Redshift Serverless.
stablecoin_payments:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../warehouse/analytics.duckdb
      threads: 4
      settings:
        memory_limit: "8GB"
    prod:
      type: redshift
      method: iam
      cluster_id: "{{ env_var('REDSHIFT_WORKGROUP', 'stablecoin-payments-dev') }}"
      host: "{{ env_var('REDSHIFT_HOST', 'not-set') }}"
      port: 5439
      dbname: analytics
      schema: analytics
      user: "{{ env_var('REDSHIFT_USER', 'dbt') }}"
      region: us-east-2
      threads: 8
      sslmode: require
