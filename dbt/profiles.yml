# dev  : DuckDB over the local lake Parquet (laptop + CI). prod : Redshift Serverless.
stablecoin_payments:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../warehouse/analytics.duckdb
      threads: 4
      settings:
        memory_limit: "8GB"
    prod:
      # Redshift Serverless. The warehouse workflow reads the admin secret from Secrets Manager
      # and exports these variables; nothing is stored in the repo.
      type: redshift
      method: database
      host: "{{ env_var('REDSHIFT_HOST', 'not-set') }}"
      port: 5439
      dbname: analytics
      schema: analytics
      user: "{{ env_var('REDSHIFT_USER', 'admin') }}"
      password: "{{ env_var('REDSHIFT_PASSWORD', '') }}"
      threads: 4
      sslmode: require
      connect_timeout: 30
